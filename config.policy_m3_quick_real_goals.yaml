# Quick policy training config, but with goals sampled from real scraped data.

data:
  seed: 0
  seq_len: 64
  batch_size: 32

  # Train text conditioning by sometimes removing numeric goal scalars.
  mask_numeric_goal_prob: 0.7

  goal_source:
    type: geometry_jsonl
    path: data/datasets/geometry/train.jsonl
    max_records: 5000

  # Mix in real mesh build traces (reversed collapse logs) so the policy
  # learns non-trivial, Blender-faithful workflows rather than collapsing to
  # repeating a single safe action.
  collapse_trace_source:
    path: data/datasets/collapse_traces
    # NOTE: trace mixing is currently disabled by default because previous
    # experiments caused severe policy collapse (e.g., spamming SELECT_RANDOM_FACE
    # even for prompts like "a cylinder"). Re-enable only after validating the
    # trace dataset + mixing schedule.
    mix_prob: 0.0
    max_traces: 50000

model:
  # state_dim = 10 (mesh stats) + 18 (GOAL_DIM: 2 scalars + 16 text-hash feats)
  state_dim: 28
  hidden_size: 256
  num_layers: 4
  num_heads: 8
  dropout: 0.1
  action_type_vocab: 12
  action_param_vocab: 32
  max_seq_len: 128

training:
  checkpoint_dir: checkpoints/policy_goal
  max_steps: 2000
  log_every: 20
  save_every: 200
  learning_rate: 3.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  mixed_precision: fp16

  # Anti-collapse: discourage the model from assigning probability mass to
  # NOOP (ActionType.NOOP=11) when the ground-truth action is not NOOP.
  noop_pred_penalty: 0.05
  noop_action_index: 11
