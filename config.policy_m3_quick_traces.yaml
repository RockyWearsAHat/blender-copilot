# Fast M3/MPS policy training with real + synthetic collapse traces mixed in.
# This is aimed at improving prompt grounding beyond primitives.

data:
  seed: 0
  seq_len: 64
  batch_size: 32

  # Force the model to use prompt hash features sometimes.
  mask_numeric_goal_prob: 0.7

  # Mix in real build traces (reversed collapse logs).
  collapse_trace_source:
    path: data/datasets/collapse_traces
    mix_prob: 0.35
    max_traces: 50000

model:
  # state_dim = 10 (mesh stats) + 18 (GOAL_DIM: 2 scalars + 16 text-hash feats)
  state_dim: 28
  hidden_size: 256
  num_layers: 4
  num_heads: 8
  dropout: 0.1
  action_type_vocab: 12
  action_param_vocab: 32
  max_seq_len: 128

training:
  checkpoint_dir: checkpoints/policy_goal_sel10
  max_steps: 2500
  log_every: 20
  save_every: 200
  learning_rate: 3.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  mixed_precision: fp16

  # Anti-collapse: discourage predicting NOOP when target isn't NOOP.
  noop_pred_penalty: 0.05
  noop_action_index: 11

  # Speed (optional): can also be enabled via CLI flag `--compile`.
  torch_compile: true
