# Prompt-faithfulness retrain (balanced prompts) with an explicit anti-NOOP
# regularizer to prevent the observed always-NOOP collapse.

model:
  state_dim: 28
  hidden_size: 256
  num_layers: 4
  num_heads: 8
  dropout: 0.1
  action_type_vocab: 12
  action_param_vocab: 32
  max_seq_len: 64

training:
  checkpoint_dir: checkpoints/policy_core_prompts_v2hash_balanced_antinoop
  learning_rate: 0.0003
  weight_decay: 0.01
  grad_clip: 1.0
  mixed_precision: fp32
  log_every: 20
  save_every: 500

  # Focus training on choosing correct action types first.
  type_loss_weight: 1.0
  param_loss_weight: 0.0

  # Penalize predicting NOOP when the target isn't NOOP.
  noop_action_index: 11
  noop_pred_penalty: 1.0

data:
  seed: 0
  seq_len: 64
  batch_size: 32

  mask_numeric_goal_prob: 1.00

  goal_source:
    type: geometry_jsonl
    path: data/datasets/prompt_goals_core_balanced.jsonl
    max_records: 100000
    min_vertices: 4
    max_vertices: 20000

  trajectory_mode: forward
  reverse_prob: 0.2
