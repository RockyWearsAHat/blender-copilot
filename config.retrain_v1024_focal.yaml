# ═══════════════════════════════════════════════════════════════
# RETRAIN — vocab 1024, focal loss, augmentation
# ═══════════════════════════════════════════════════════════════
# Root cause of mode collapse: 8188 coordinate bins with axis-aligned
# meshes → 2-3 tokens dominate the entire distribution → CE converges
# to only predicting those tokens.
#
# Fixes applied:
#   1. Reduced vocab_size from 8192 → 1024 (1020 coordinate bins)
#      Each bin covers ~0.002 of [-1, 1] range (still millimeter precision)
#      Much more uniform bin utilization, fewer "empty" bins
#   2. Random rotation augmentation in _tokenize_objects (already in code)
#      Breaks axis-alignment → spreads coordinates across all bins
#   3. Focal loss (gamma=2.0) down-weights easy/frequent tokens
#      Prevents the model from only learning the most common bins
#
# IMPORTANT: Delete old cache before training!
#   rm -rf data/processed/.mesh_cache
# ═══════════════════════════════════════════════════════════════

project:
  name: BlenderModelTraining
  version: 0.2.0
  stage: retrain_v1024_focal
  quality_tag: low_poly
  stage_notes: >
    Fresh retrain with 1024-vocab tokenizer, focal loss, and mesh
    augmentation to fix mode collapse. Training from scratch — no
    checkpoint resume.

data:
  geometry_dir: data/datasets/geometry
  materials_train: data/datasets/geometry/materials_train.jsonl
  modifiers_train: data/datasets/geometry/modifiers_train.jsonl
  real_mesh_dirs:
    - data/processed/objaverse
    - data/processed/blendswap
    - data/processed/blender_official
    - data/processed/smutbase
    - data/processed/github
    - data/processed/open3dlab
    - data/processed/youtube
  cache_dir: data/processed/.mesh_cache # NOTE: delete old cache before training!
  eval_dir: data/eval
  renders_dir: data/renders

tokenization:
  vocab_size: 1024
  coordinate_range: [-1.0, 1.0]
  max_faces: 400
  max_vertices: 8192
  face_ordering: "z_curve"
  triangulate: true

unified:
  embed_dim: 384

  text_vocab_size: 8000
  text_max_length: 192
  text_num_layers: 2
  text_num_heads: 6
  dropout: 0.1

  enable_materials: false
  enable_modifiers: false
  enable_contrastive: false
  enable_image_to_mesh: false

  image_size: 32
  image_num_views: 1

  geometry:
    num_layers: 5
    num_heads: 6
    mesh_vocab_size: 1024
    max_seq_length: 3602

  materials:
    num_layers: 6
    num_heads: 8
    hidden_size: 256
    max_seq_len: 512
    vocab_size: 4096

  modifiers:
    hidden_size: 256

training:
  batch_size: 1
  gradient_accumulation_steps: 16
  mixed_precision: "fp32"

  learning_rate: 8.0e-5
  weight_decay: 0.01
  warmup_steps: 500
  max_steps: 60000

  focal_gamma: 2.0

  naninf_guard_threshold: 32
  naninf_guard_mode: "advance"

  eval_every: 2000
  save_every: 1000

  optimizer: "adamw"
  scheduler: "cosine"

  task_weights:
    geometry: 3.0
    real_geometry: 10.0
    materials: 0.0
    modifiers: 0.0
    contrastive: 0.0
    image_geometry: 0.0

  augmentation:
    random_rotation: true
    random_scale: [0.9, 1.1]
    random_flip: true
    noise_std: 0.002

inference:
  server_port: 8420
  device: "auto"
  max_generation_time_seconds: 30
  quantization: null

  postprocess:
    remove_degenerate_faces: true
    merge_by_distance: 0.0001
    recalculate_normals: true
    smooth_shade: true

rlhf:
  enabled: false
