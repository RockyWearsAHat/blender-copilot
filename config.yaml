# Global configuration for BlenderModelTraining

project:
  name: BlenderModelTraining
  version: 0.1.0

# ── Data Collection ──────────────────────────────────────────────────────

scraping:
  output_dir: data/raw
  max_file_size_mb: 5000 # Production default: do not discard detailed assets by size
  respect_rate_limits: true
  user_agent: "BlenderModelTraining/0.1 (research; open-source)"

  blendswap:
    enabled: true
    base_url: "https://www.blendswap.com"
    licenses: ["CC-0", "CC-BY"] # Only free-to-use licenses
    categories:
      [
        "characters",
        "vehicles",
        "architecture",
        "furniture",
        "nature",
        "electronics",
        "animals",
        "objects",
        "interior",
        "exterior",
        "mechanical",
        "sci-fi",
      ]
    max_pages_per_category: 50

  objaverse:
    enabled: true
    max_models: 50000 # How many models to download
    categories: null # null = all categories

  github:
    enabled: true
    search_query: "extension:blend"
    licenses: ["mit", "apache-2.0", "cc0-1.0", "cc-by-4.0"]
    max_repos: 5000

  youtube:
    enabled: true
    # Channel-based scraping (default mode)
    # Channels are defined in scrapers/youtube_scraper.py CURATED_CHANNELS
    max_tier: 2 # Scrape tier 1 + 2 by default (skip tier 3)
    max_per_channel: 200
    download_blends: true # Download blends when available (skip templates)
    extract_transcripts: true

    # Extra channels not in the built-in list (handle, name, tier, specialty)
    extra_channels: []

    # Legacy keyword search (used with --legacy-search flag)
    search_queries:
      - "blender modeling tutorial"
      - "blender hard surface modeling"
      - "blender sculpting tutorial"
      - "blender geometry nodes tutorial"
      - "blender materials tutorial"
    max_videos_per_query: 100

# ── Data Processing ──────────────────────────────────────────────────────

processing:
  blender_executable: "blender" # Path to Blender binary
  output_dir: data/processed

  mesh_extraction:
    min_vertices: 8 # Skip trivially simple meshes
    max_vertices: 5000000 # Production default: preserve high-detail meshes
    coordinate_precision: 4 # Decimal places for vertex coords
    normalize: true # Center and scale to unit sphere

  material_extraction:
    include_node_trees: true
    include_textures: false # Textures are large — extract separately
    max_nodes_per_material: 50

  modifier_extraction:
    include_applied: false # Only extract unapplied modifier stacks

  quality_filter:
    min_faces: 12 # At least a cube-like object
    max_non_manifold_ratio: 0.1 # Skip broken meshes
    require_materials: false
    deduplicate: true
    dedup_similarity_threshold: 0.95

# ── Data Paths ───────────────────────────────────────────────────────────
# Central registry of all data paths. Training, eval, and scripts all
# read from here so there is ONE source of truth.

data:
  geometry_dir: data/datasets/geometry
  materials_train: data/datasets/geometry/materials_train.jsonl
  modifiers_train: data/datasets/geometry/modifiers_train.jsonl
  real_mesh_dirs:
    - data/processed/objaverse
    - data/processed/blendswap
    - data/processed/blender_official
    - data/processed/smutbase
    - data/processed/github
    - data/processed/open3dlab
    - data/processed/youtube
  cache_dir: data/processed/.mesh_cache
  eval_dir: data/eval
  renders_dir: data/renders

# ── Mesh Tokenization ────────────────────────────────────────────────────

tokenization:
  # MeshGPT-style face tokenization
  vocab_size: 8192 # Number of quantized coordinate tokens
  coordinate_range: [-1.0, 1.0] # After normalization
  max_faces: 8000 # High-detail training budget (H100 80GB)
  max_vertices: 16384 # Max vertices per training example
  face_ordering: "z_curve" # Spatial ordering for faces: z_curve, hilbert, random

  # Sequence format: each face = [v1x, v1y, v1z, v2x, v2y, v2z, v3x, v3y, v3z]
  # Triangulated meshes for consistent token count per face
  triangulate: true

# ── Model Configuration ──────────────────────────────────────────────────

# The 'unified' key is what the actual training code reads.
# Uses RoPE (no fixed max length) + gradient checkpointing on MPS.
# batch_size=1 + grad_accum=8 on MPS for long sequence support.
unified:
  embed_dim: 1024
  text_vocab_size: 8000
  text_max_length: 256
  text_num_layers: 4
  text_num_heads: 16
  dropout: 0.1

  # Feature flags — disable optional heads on constrained hardware.
  # On a laptop (MPS, 36 GB), set all three false to save ~15M params
  # of GPU memory, leaving more room for long geometry sequences.
  # Turn them on when training on a GPU server with >=24 GB VRAM.
  enable_materials: true
  enable_modifiers: true
  # Contrastive: aligns rendered images with text descriptions (CLIP-style).
  # Required for image-to-mesh. Uses ~1M extra params, ~2 GB VRAM.
  # Enable on any machine with >=16 GB RAM/VRAM.
  enable_contrastive: true
  # Image-to-mesh: conditions geometry decoder on spatial image features.
  # Requires enable_contrastive=true. Adds 16 cross-attention tokens.
  # Enable to train the model to reconstruct 3D from rendered images.
  enable_image_to_mesh: true

  # Image encoder settings
  image_size: 64 # Input render resolution (64x64 is fast + sufficient)
  image_num_views: 4 # Multi-view renders per training example

  geometry:
    num_layers: 16
    num_heads: 16
    mesh_vocab_size: 8192
    # 8000 faces × 9 tokens + 2 (BOS/EOS) = 72002
    # H100 80GB: gradient checkpointing + mixed precision
    # M3 inference: CPU mode with lower max_faces (capped to 900 in code)
    max_seq_length: 72002

  materials:
    num_layers: 6
    num_heads: 8
    hidden_size: 256
    max_seq_len: 512
    vocab_size: 4096

  modifiers:
    hidden_size: 256

# ── Training ─────────────────────────────────────────────────────────────

training:
  batch_size: 8
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 1000
  max_steps: 150000
  eval_every: 1000
  save_every: 5000
  gradient_accumulation_steps: 4
  mixed_precision: "fp16" # fp16, bf16, or fp32

  optimizer: "adamw"
  scheduler: "cosine"

  # Data augmentation for meshes
  augmentation:
    random_rotation: true
    random_scale: [0.8, 1.2]
    random_flip: true
    noise_std: 0.001

# ── Inference ────────────────────────────────────────────────────────────

inference:
  server_port: 8420
  device: "auto" # auto, cuda, mps, cpu
  max_generation_time_seconds: 30

  # Quantization for smaller models / faster inference
  quantization: null # null, int8, int4

  # Output post-processing
  postprocess:
    remove_degenerate_faces: true
    merge_by_distance: 0.0001
    recalculate_normals: true
    smooth_shade: true

# ── RLHF — Human Feedback Training ──────────────────────────────────────

rlhf:
  enabled: true

  # DPO (Direct Preference Optimization)
  dpo_beta: 0.1 # KL penalty (higher = more conservative updates)
  dpo_lr: 1.0e-5 # Learning rate for DPO policy updates
  dpo_steps_per_update: 5 # DPO gradient steps per feedback batch
  kl_penalty: 0.01 # Additional KL divergence penalty weight

  # Feedback collection
  feedback_path: "data/feedback/feedback_buffer.jsonl"
  feedback_max_size: 10000 # Max stored feedback items
  feedback_batch_trigger: 20 # Train reward model after N new items
  feedback_time_trigger: 60 # Or after N seconds since last train

  # Reward model
  reward_hidden_dim: 256
  reward_dropout: 0.1
  reward_lr: 3.0e-4
  reward_epochs: 3 # Training epochs per burst
  reward_checkpoint: "checkpoints/reward/latest.pt"

  # Active query selection
  n_candidates: 4 # Candidates to generate for A/B comparison
  uncertainty_strategy: "disagreement" # disagreement, margin, random
  mc_dropout_passes: 10 # MC Dropout forward passes for uncertainty

  # Evaluation dashboard
  eval_scenarios_path: "data/eval/scenarios.jsonl"
  eval_results_path: "data/eval/results.jsonl"
  eval_every_updates: 10 # Run eval dashboard every N RLHF updates

  # Sequence limits
  max_text_length: 256
  max_mesh_length: 72002 # 8000 faces × 9 tokens + 2 for BOS/EOS
